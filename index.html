<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barro – Pedidos</title>
<style>
body{margin:0;font:16px system-ui,sans-serif;background:#faf5ef;color:#2b1d16;padding-bottom:90px}
header{background:#8a3b2a;color:#fff;padding:14px 16px}h1{margin:0;font-size:22px}
main{max-width:520px;margin:auto;padding:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.chip{border:0;border-radius:99px;padding:8px 14px;background:#fff;white-space:nowrap}.chip.on{background:#8a3b2a;color:#fff}
.it{display:flex;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:10px;margin:8px 0}
.it div{flex:1}small{color:#7a6a5a}b.p{color:#8a3b2a}
button.b{background:#8a3b2a;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700}
.q{width:34px;height:34px;border-radius:50%;border:0;background:#8a3b2a;color:#fff;font-size:20px}
input,select,textarea{width:100%;padding:10px;margin:4px 0;border:1px solid #cdbfb0;border-radius:10px;font:inherit;box-sizing:border-box}
#bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px 16px;box-shadow:0 -2px 8px #0003;display:flex;justify-content:space-between;align-items:center}
.card{background:#fff;border-radius:12px;padding:12px;margin:10px 0}
</style></head><body>
<header><h1>🍽️ Barro · Comedor y Leña</h1><small style="color:#fff">Pedí desde tu mesa</small></header>
<main id="app">Cargando…</main>
<div id="bar"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const db=supabase.createClient(CFG.url,CFG.key),$=s=>document.querySelector(s);
const fmt=n=>'$ '+n.toLocaleString('es-AR');
let items=[],cart={},cat='',view='menu',myId=localStorage.getItem('orderId'),track=null;
const total=()=>Object.entries(cart).reduce((a,[i,q])=>a+items.find(x=>x.id==i).price*q,0);
const cnt=()=>Object.values(cart).reduce((a,b)=>a+b,0);
async function load(){
  const {data,error}=await db.from('menu_items').select('*').eq('available',true).order('id');
  if(error){$('#app').textContent='Error: '+error.message;return}
  items=data;cat=items[0]?.category;draw();if(myId)poll();
}
function draw(){
  const cats=[...new Set(items.map(i=>i.category))];
  let h='';
  if(view==='menu'){
    h=`<div class="chips">${cats.map(c=>`<button class="chip ${c==cat?'on':''}" onclick="cat='${c}';draw()">${c}</button>`).join('')}</div>`+
    items.filter(i=>i.category==cat).map(i=>`<div class="it"><div><b>${i.name}</b>${i.popular?' ⭐':''}<br><small>${i.description}</small><br><b class="p">${fmt(i.price)}</b></div><button class="q" onclick="cart[${i.id}]=(cart[${i.id}]||0)+1;draw()">+</button></div>`).join('')+
    `${resCard()}<div class="card"><b>Reservar mesa</b><input id="rn" placeholder="Nombre"><input id="rt" type="tel" placeholder="WhatsApp (ej: 11 6852 1226)"><input id="rw" type="datetime-local"><select id="rp">${[1,2,3,4,5,6,8,10].map(n=>`<option>${n}</option>`).join('')}</select><button class="b" onclick="reserve()">Pedir reserva</button></div>`;
  }else if(view==='cart'){
    h=`<h3>Tu pedido</h3>`+Object.entries(cart).map(([i,q])=>{const x=items.find(y=>y.id==i);return `<div class="it"><div>${x.name}<br><b class="p">${fmt(x.price*q)}</b></div><button class="q" onclick="cart[${i}]>1?cart[${i}]--:delete cart[${i}];draw()">−</button><b>${q}</b><button class="q" onclick="cart[${i}]++;draw()">+</button></div>`}).join('')||'<p>Vacío</p>';
    h+=`<input id="nm" placeholder="Tu nombre"><input id="tb" placeholder="N° de mesa"><textarea id="nt" placeholder="Aclaraciones (sin sal, punto de cocción…)"></textarea><button class="b" onclick="send()">Enviar pedido · ${fmt(total())}</button> <button class="chip" onclick="view='menu';draw()">Volver</button>`;
  }else{
    h=`<div class="card"><h3>Estado de tu pedido</h3><p style="font-size:22px">${track?{recibido:'📝 Recibido',preparando:'👨‍🍳 Preparando',listo:'✅ Listo',entregado:'🍽️ Entregado'}[track.status]:'…'}</p><button class="chip" onclick="view='menu';draw()">Hacer otro pedido</button></div>`;
  }
  $('#app').innerHTML=h;
  $('#bar').innerHTML=cnt()&&view==='menu'?`<span>${cnt()} ítems · <b>${fmt(total())}</b></span><button class="b" onclick="view='cart';draw()">Ver pedido</button>`:(myId&&view==='menu'?`<button class="b" onclick="view='track';poll()">Seguir mi pedido</button>`:'');
}
async function send(){
  if(!cnt())return;
  const lines=Object.entries(cart).map(([i,q])=>{const x=items.find(y=>y.id==i);return{name:x.name,qty:q,price:x.price}});
  const {data,error}=await db.from('orders').insert({customer_name:$('#nm').value,table_label:$('#tb').value,note:$('#nt').value,items:lines,total:total()}).select().single();
  if(error)return alert('Error: '+error.message);
  myId=data.id;localStorage.setItem('orderId',myId);cart={};view='track';track=data;draw();
}
async function poll(){
  if(!myId)return;
  const {data}=await db.from('orders').select('*').eq('id',myId).maybeSingle();
  if(data){track=data;if(view==='track')draw()}
  setTimeout(poll,5000);
}
async function reserve(){
  if(!$('#rn').value||!$('#rw').value)return alert('Completá nombre y fecha');
  if($('#rt').value.replace(/\D/g,'').length<8)return alert('Ingresá un WhatsApp válido para confirmarte la reserva');
  const id=crypto.randomUUID(),when=new Date($('#rw').value).toISOString(),party=+$('#rp').value;
  const {error}=await db.from('reservations').insert({id,name:$('#rn').value,phone:$('#rt').value,party,when_at:when});
  if(error)return alert('Error: '+error.message);
  myRes={id,when,party,status:'pendiente'};localStorage.setItem('res',JSON.stringify(myRes));
  alert('¡Reserva solicitada! Mirá el estado en esta pantalla.');pollRes();draw();
  
}
let myRes=JSON.parse(localStorage.getItem('res')||'null'),rt;
function resCard(){
  if(!myRes)return '';
  const t={pendiente:'⏳ Pendiente de confirmación',confirmada:'✅ Confirmada',cancelada:'❌ Cancelada'}[myRes.status]||myRes.status;
  return `<div class="card"><b>Tu reserva</b><br>${myRes.party} persona(s) · ${new Date(myRes.when).toLocaleString('es-AR',{dateStyle:'medium',timeStyle:'short'})}<br><span style="font-size:18px">${t}</span> <button class="chip" onclick="clearRes()">Ocultar</button></div>`;
}
function clearRes(){myRes=null;localStorage.removeItem('res');draw()}
async function pollRes(){
  clearTimeout(rt);
  if(!myRes)return;
  const {data}=await db.rpc('reservation_status',{rid:myRes.id});
  if(data&&data!==myRes.status){myRes.status=data;localStorage.setItem('res',JSON.stringify(myRes));if(view==='menu'&&!document.activeElement?.matches('input,select'))draw()}
  rt=setTimeout(pollRes,10000);
}
load();pollRes();
</script></body></html>
