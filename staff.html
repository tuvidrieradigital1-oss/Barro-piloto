<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Barro – Panel</title>
<style>
body{margin:0;font:16px system-ui,sans-serif;background:#1c1411;color:#f2e8d6}
main{max-width:980px;margin:auto;padding:12px}h1{font-size:20px}
.card{background:#2b201b;border-radius:12px;padding:12px;margin:10px 0}
.tabs{display:flex;gap:8px}.t{font-size:14px;flex:1;border:0;border-radius:10px;padding:10px;background:#2b201b;color:#f2e8d6}.t.on{background:#c0583f}
button.b{background:#c0583f;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700}
input{width:100%;padding:10px;margin:4px 0;border-radius:10px;border:0;box-sizing:border-box;font:inherit}
.row2{display:flex;gap:8px;margin:10px 0;align-items:center}.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}.grid2 .card{margin:0}.card .card{background:#382a23;margin:8px 0 0}.rk{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:8px;margin:3px 0}.rk .n{width:22px;font-weight:700;color:#d6ab5c}.rk .nm{flex:1}h3{margin:0 0 8px;font-size:16px}.s{font-size:12px;background:#c0583f55;border-radius:99px;padding:3px 10px}small{color:#b9a995}
</style></head><body><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const db=supabase.createClient(CFG.url,CFG.key),$=s=>document.querySelector(s);
const fmt=n=>'$ '+n.toLocaleString('es-AR'),NEXT={recibido:'preparando',preparando:'listo',listo:'entregado'};
let tab='orders',orders=[],res=[],menu=[],timer;
async function init(){
  const {data:{session}}=await db.auth.getSession();
  session?start():login();
}
function login(msg=''){ $('#app').innerHTML=`<h1>Panel del local</h1><p>${msg}</p><input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Contraseña"><button class="b" onclick="signin()">Entrar</button>`}
async function signin(){const {error}=await db.auth.signInWithPassword({email:$('#e').value,password:$('#p').value});error?login(error.message):start()}
function start(){load();clearInterval(timer);timer=setInterval(load,5000)}
let dayOff=0,showDone=false,showPast=false,openT={},st={m:'',orders:null,busy:false};
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');st.m=ym(new Date());
const t0=(off=0)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+off);return d};
const hm=d=>new Date(d).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PAY={efectivo:'Efectivo',tarjeta:'Tarjeta',transferencia:'Transferencia/MP'};
const DRINK=/bebida|cerveza|vino|cocktail|coctel|trago|caf[eé]|gaseosa|jugo|alcohol|espumante|licor|whisky|agua/i;
async function load(){
  const a=t0(dayOff),b=t0(dayOff+1);
  [orders,res,menu]=await Promise.all([
    db.from('orders').select('*').gte('created_at',a.toISOString()).lt('created_at',b.toISOString()).order('created_at',{ascending:false}).then(r=>r.data||[]),
    db.from('reservations').select('*').order('when_at').then(r=>r.data||[]),
    db.from('menu_items').select('*').order('id').then(r=>r.data||[])]);
  if(dayOff===0)notify();
  draw();
}
function goDay(n){dayOff=n;showDone=false;seenO=null;seenR=null;load()}
const orderCard=o=>`<div class="card"><b>${esc(o.customer_name)||'Sin nombre'}</b> · Mesa ${esc(o.table_label||'-')} <span class="s">${o.status}</span><br>${(o.items||[]).map(i=>i.qty+'× '+esc(i.name)).join('<br>')}<br>${o.note?`<small>“${esc(o.note)}”</small><br>`:''}<b>${fmt(o.total)}</b> · <small>${PAY[o.payment]||'Pago s/d'} · ${hm(o.created_at)}</small><br>${NEXT[o.status]?`<button class="b" onclick="setS('orders','${o.id}','${NEXT[o.status]}')">Pasar a ${NEXT[o.status]}</button>`:''}</div>`;
function block(mesa,os){
  const key=String(mesa).replace(/[^\w-]/g,''),it={},pay={},by={};
  os.forEach(o=>{(o.items||[]).forEach(i=>it[i.name]=(it[i.name]||0)+i.qty);const p=PAY[o.payment]||'s/d';pay[p]=(pay[p]||0)+1;(by[o.status]=by[o.status]||[]).push(o.id)});
  const notes=os.filter(o=>o.note).map(o=>`<small>${esc(o.customer_name)}: “${esc(o.note)}”</small>`).join('<br>');
  const btns=Object.entries(by).map(([s,ids])=>`<button class="b" onclick="setMany('${ids.join(',')}','${NEXT[s]}')">Pasar ${ids.length} de ${s} a ${NEXT[s]}</button>`).join(' ');
  return `<div class="card"><h3>Mesa ${esc(mesa)} · ${os.length} pedido(s) · ${fmt(os.reduce((a,o)=>a+o.total,0))}</h3>${Object.entries(it).map(([n,q])=>q+'× '+esc(n)).join('<br>')}<br>${notes?notes+'<br>':''}<small>Pagos: ${Object.entries(pay).map(([p,n])=>n+' '+p).join(', ')}</small><br>${btns}<br><button class="t" style="margin-top:8px;width:100%" onclick="openT['${key}']=!openT['${key}'];draw()">${openT[key]?'Ocultar':'Ver'} detalle por persona</button>${openT[key]?os.map(orderCard).join(''):''}</div>`;
}
function blocks(list){
  const g={};list.forEach(o=>{const k=o.table_label||'-';(g[k]=g[k]||[]).push(o)});
  return Object.entries(g).map(([m,os])=>block(m,os)).join('');
}
const resItem=r=>`<div class="card"><b>${esc(r.name)}</b> · ${r.party} pers. <span class="s">${r.status}</span><br>${new Date(r.when_at).toLocaleString('es-AR')}<br><small>${esc(r.phone||'')}</small><br>${r.status=='pendiente'?(r.phone?`<button class="b" onclick="wa('${r.id}','confirmada')">Confirmar y avisar por WhatsApp</button> `:`<button class="b" onclick="setS('reservations','${r.id}','confirmada')">Confirmar</button> `)+`<button class="b" onclick="setS('reservations','${r.id}','cancelada')">Cancelar</button>`:''}${r.status=='confirmada'&&r.phone?`<button class="b" onclick="wa('${r.id}')">Reenviar WhatsApp</button>`:''}</div>`;
const fold=(flag,name,label,n,items)=>n?`<button class="t" style="width:100%;margin:10px 0" onclick="${name}=!${name};draw()">${flag?'Ocultar':'Ver'} ${label} (${n})</button>`+(flag?`<div class="grid2">${items}</div>`:''):'';
async function setMany(ids,s){await db.from('orders').update({status:s}).in('id',ids.split(','));load()}

/* ---------- Ranking mensual ---------- */
const range=m=>{const [y,mo]=m.split('-').map(Number);return[new Date(y,mo-1,1),new Date(y,mo,1)]};
async function loadStats(){
  st.busy=true;const [a,b]=range(st.m);let all=[],from=0;
  for(;;){
    const {data,error}=await db.from('orders').select('items,total,payment,created_at').gte('created_at',a.toISOString()).lt('created_at',b.toISOString()).order('created_at').range(from,from+999);
    if(error){alert('Error: '+error.message);break}
    all=all.concat(data);if(data.length<1000)break;from+=1000;
  }
  st.orders=all;st.busy=false;draw();
}
function stMonth(n){const [y,m]=st.m.split('-').map(Number);st.m=ym(new Date(y,m-1+n,1));st.orders=null;draw()}
function stSet(v){if(!v)return;document.activeElement&&document.activeElement.blur();st.m=v;st.orders=null;draw()}
function rank(list){
  const cat={};menu.forEach(m=>cat[m.name]=m.category);const m={};
  list.forEach(o=>(o.items||[]).forEach(i=>{const c=i.cat||cat[i.name]||'';const x=m[i.name]=m[i.name]||{n:i.name,q:0,$:0,d:DRINK.test(c)};x.q+=i.qty;x.$+=i.qty*i.price}));
  const a=Object.values(m).sort((x,y)=>y.q-x.q||y.$-x.$);return{food:a.filter(x=>!x.d),drink:a.filter(x=>x.d)};
}
function statsView(){
  if(st.orders===null){if(!st.busy)loadStats();return '<p>Cargando…</p>'}
  const o=st.orders,R=rank(o),[a]=range(st.m),pay={};
  o.forEach(x=>{const p=PAY[x.payment]||'Sin dato';pay[p]=(pay[p]||0)+1});
  const units=[...R.food,...R.drink].reduce((s,x)=>s+x.q,0),rev=o.reduce((s,x)=>s+x.total,0);
  const sold=new Set([...R.food,...R.drink].map(x=>x.n));
  const zero=d=>menu.filter(m=>DRINK.test(m.category)===d&&!sold.has(m.name)).map(m=>esc(m.name));
  const col=(t,arr,z)=>`<div class="card"><h3>${t}</h3>${arr.length?arr.map((x,i)=>{const p=Math.round(x.q/arr[0].q*100);return `<div class="rk" style="background:linear-gradient(90deg,#c0583f66 ${p}%,transparent ${p}%)"><span class="n">${i+1}</span><span class="nm">${esc(x.n)}</span><b>${x.q}</b></div>`}).join(''):'<p><small>Sin pedidos este mes.</small></p>'}${z.length?`<small>Sin pedidos este mes: ${z.join(', ')}</small>`:''}</div>`;
  return `<div class="row2"><button class="t" onclick="stMonth(-1)">‹ Mes anterior</button><input type="month" value="${st.m}" onchange="stSet(this.value)" style="flex:1.4;margin:0"><button class="t" onclick="stMonth(1)">Mes siguiente ›</button></div>
  <div class="card"><h3>${a.toLocaleDateString('es-AR',{month:'long',year:'numeric'})}</h3>${o.length} pedidos · ${units} unidades · <b>${fmt(rev)}</b><br><small>Pagos: ${Object.entries(pay).map(([p,n])=>n+' '+p).join(', ')||'—'}</small></div>
  <div class="grid2">${col('Comidas (de más a menos pedida)',R.food,zero(false))}${col('Bebidas (de más a menos pedida)',R.drink,zero(true))}</div>
  <div class="row2"><button class="t" onclick="csv()">Descargar CSV</button><button class="t" style="color:#ff9b8a" onclick="delMonth()">Borrar datos de este mes</button></div>
  <p><small>El ranking cuenta unidades pedidas. Descarga el CSV antes de borrar: al borrar se eliminan los pedidos del mes y sus ingresos, y no se puede deshacer.</small></p>`;
}
function csv(){
  const R=rank(st.orders),rows=[['tipo','posicion','producto','unidades','ingresos']];
  [['Comida',R.food],['Bebida',R.drink]].forEach(([t,a])=>a.forEach((x,i)=>rows.push([t,i+1,x.n,x.q,x.$])));
  const blob=new Blob(['\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n')],{type:'text/csv'});
  const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download='ranking-'+st.m+'.csv';l.click();
}
async function delMonth(){
  const [a,b]=range(st.m),n=st.orders.length;
  if(!n)return alert('Este mes no tiene pedidos.');
  if(!confirm('Vas a borrar los '+n+' pedidos de '+st.m+'. También se pierden sus ingresos y no se puede deshacer. ¿Querés continuar?'))return;
  const {error}=await db.from('orders').delete().gte('created_at',a.toISOString()).lt('created_at',b.toISOString());
  if(error)return alert('Error: '+error.message);
  st.orders=null;load();
}

function draw(){
  if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
  const rev=orders.reduce((a,o)=>a+o.total,0);
  const act=orders.filter(o=>o.status!=='entregado').sort((x,y)=>new Date(x.created_at)-new Date(y.created_at));
  const done=orders.filter(o=>o.status==='entregado');
  const today=t0(),up=res.filter(r=>new Date(r.when_at)>=today);
  const past=res.filter(r=>new Date(r.when_at)<today).sort((x,y)=>new Date(y.when_at)-new Date(x.when_at));
  const lbl=dayOff===0?'Hoy':t0(dayOff).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
  let h=`<h1>Barro · Panel</h1>${soundOn?'<p class="muted">🔔 Avisos activados</p>':'<button class="b" onclick="enableSound()">🔔 Activar sonido de avisos</button>'}<div class="card">${lbl}: <b>${fmt(rev)}</b> · ${orders.length} pedidos (${act.length} activos) · ${up.filter(r=>r.status=='pendiente').length} reservas pendientes</div>
  <div class="tabs">${[['orders','Pedidos'],['res','Reservas'],['menu','Menú'],['stats','Ranking']].map(([k,l])=>`<button class="t ${tab==k?'on':''}" onclick="tab='${k}';if(k=='stats')st.orders=null;draw()">${l}</button>`).join('')}</div>`;
  if(tab=='orders'){
    h+=`<div class="row2"><button class="t" onclick="goDay(${dayOff-1})">‹ Día anterior</button>${dayOff<0?`<button class="t" onclick="goDay(0)">Hoy</button><button class="t" onclick="goDay(${dayOff+1})">Día siguiente ›</button>`:''}</div>`;
    h+=act.length?`<div class="grid2">${blocks(act)}</div>`:'<p>No hay pedidos activos.</p>';
    h+=fold(showDone,'showDone','entregados',done.length,done.map(orderCard).join(''));
  }
  if(tab=='res'){
    h+=up.length?`<div class="grid2">${up.map(resItem).join('')}</div>`:'<p>No hay reservas próximas.</p>';
    h+=fold(showPast,'showPast','reservas anteriores',past.length,past.map(resItem).join(''));
  }
  if(tab=='menu')h+=`<div class="grid2">${menu.map(m=>`<div class="card">${esc(m.name)} <small>${fmt(m.price)}</small> <button class="b" onclick="tog(${m.id},${!m.available})">${m.available?'Disponible ✔':'Agotado ✖'}</button></div>`).join('')}</div>`;
  if(tab=='stats')h+=statsView();
  h+=`<p><button class="t" onclick="db.auth.signOut().then(()=>location.reload())">Cerrar sesión</button></p>`;
  $('#app').innerHTML=h;
}
let ac=null,seenO=null,seenR=null,wl=null,soundOn=false;
async function enableSound(){
  ac=new (window.AudioContext||window.webkitAudioContext)();soundOn=true;beep();
  try{wl=await navigator.wakeLock.request('screen')}catch(e){}
  draw();
}
function beep(){
  if(!ac)return;
  [0,.3,.6].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+t;
    o.frequency.value=880;o.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(.4,n);g.gain.exponentialRampToValueAtTime(.001,n+.25);o.start(n);o.stop(n+.25)});
  if(navigator.vibrate)navigator.vibrate([200,100,200]);
}
function notify(){
  const o=new Set(orders.map(x=>x.id)),r=new Set(res.map(x=>x.id));
  if(seenO){
    const no=[...o].filter(i=>!seenO.has(i)).length,nr=[...r].filter(i=>!seenR.has(i)).length;
    if(no||nr){if(soundOn)beep();document.title='🔔 '+(no?no+' pedido(s) nuevo(s) ':'')+(nr?nr+' reserva(s) nueva(s)':'')}
  }
  seenO=o;seenR=r;
}
window.addEventListener('focus',()=>document.title='Barro – Panel');
document.addEventListener('click',()=>{document.title='Barro – Panel'});
document.addEventListener('visibilitychange',()=>{if(soundOn&&document.visibilityState==='visible'&&navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>wl=l).catch(()=>{})});
function waNum(p){let d=(p||'').replace(/\D/g,'').replace(/^00/,'');if(d.startsWith('54'))return d.startsWith('549')?d:'549'+d.slice(2);d=d.replace(/^0/,'');if(/^1115/.test(d)&&d.length==12)d='11'+d.slice(4);if(d.length==8)d='11'+d;return '549'+d}
function wa(id,estado){
  const r=res.find(x=>x.id==id);if(!r)return;
  const f=new Date(r.when_at).toLocaleString('es-AR',{dateStyle:'full',timeStyle:'short'});
  const msg=`Hola ${r.name}! Tu reserva en Barro para ${r.party} persona(s) el ${f} está confirmada. ¡Te esperamos! Urquiza 4884, Caseros.`;
  window.open('https://wa.me/'+waNum(r.phone)+'?text='+encodeURIComponent(msg),'_blank');
  if(estado)setS('reservations',id,estado);
}
async function setS(t,id,s){await db.from(t).update({status:s}).eq('id',id);load()}
async function tog(id,v){await db.from('menu_items').update({available:v}).eq('id',id);load()}
init();
</script></body></html>
