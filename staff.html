<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Barro – Panel</title>
<style>
body{margin:0;font:16px system-ui,sans-serif;background:#1c1411;color:#f2e8d6}
main{max-width:640px;margin:auto;padding:12px}h1{font-size:20px}
.card{background:#2b201b;border-radius:12px;padding:12px;margin:10px 0}
.tabs{display:flex;gap:8px}.t{flex:1;border:0;border-radius:10px;padding:10px;background:#2b201b;color:#f2e8d6}.t.on{background:#c0583f}
button.b{background:#c0583f;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700}
input{width:100%;padding:10px;margin:4px 0;border-radius:10px;border:0;box-sizing:border-box;font:inherit}
.row2{display:flex;gap:8px;margin:10px 0}.s{font-size:12px;background:#c0583f55;border-radius:99px;padding:3px 10px}small{color:#b9a995}
</style></head><body><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const db=supabase.createClient(CFG.url,CFG.key),$=s=>document.querySelector(s);
const fmt=n=>'$ '+n.toLocaleString('es-AR'),NEXT={recibido:'preparando',preparando:'listo',listo:'entregado'};
let tab='orders',orders=[],res=[],menu=[],timer;
async function init(){
  const {data:{session}}=await db.auth.getSession();
  session?start():login();
}
function login(msg=''){ $('#app').innerHTML=`<h1>Panel del local</h1><p>${msg}</p><input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Contraseña"><button class="b" onclick="signin()">Entrar</button>`}
async function signin(){const {error}=await db.auth.signInWithPassword({email:$('#e').value,password:$('#p').value});error?login(error.message):start()}
function start(){load();clearInterval(timer);timer=setInterval(load,5000)}
let dayOff=0,showDone=false,showPast=false;
const t0=(off=0)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+off);return d};
const hm=d=>new Date(d).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
async function load(){
  const a=t0(dayOff),b=t0(dayOff+1);
  [orders,res,menu]=await Promise.all([
    db.from('orders').select('*').gte('created_at',a.toISOString()).lt('created_at',b.toISOString()).order('created_at',{ascending:false}).then(r=>r.data||[]),
    db.from('reservations').select('*').order('when_at').then(r=>r.data||[]),
    db.from('menu_items').select('*').order('id').then(r=>r.data||[])]);
  if(dayOff===0)notify();
  draw();
}
function goDay(n){dayOff=n;showDone=false;seenO=null;seenR=null;load()}
const orderCard=o=>`<div class="card"><b>Mesa ${o.table_label||'-'}</b> · ${o.customer_name||''} <span class="s">${o.status}</span><br>${o.items.map(i=>i.qty+'× '+i.name).join('<br>')}<br><small>${o.note||''}</small><br><b>${fmt(o.total)}</b> <small>${hm(o.created_at)}</small><br>${NEXT[o.status]?`<button class="b" onclick="setS('orders','${o.id}','${NEXT[o.status]}')">Pasar a ${NEXT[o.status]}</button>`:''}</div>`;
const resItem=r=>`<div class="card"><b>${r.name}</b> · ${r.party} pers. <span class="s">${r.status}</span><br>${new Date(r.when_at).toLocaleString('es-AR')}<br><small>${r.phone||''}</small><br>${r.status=='pendiente'?(r.phone?`<button class="b" onclick="wa('${r.id}','confirmada')">Confirmar y avisar por WhatsApp</button> `:`<button class="b" onclick="setS('reservations','${r.id}','confirmada')">Confirmar</button> `)+`<button class="b" onclick="setS('reservations','${r.id}','cancelada')">Cancelar</button>`:''}${r.status=='confirmada'&&r.phone?`<button class="b" onclick="wa('${r.id}')">Reenviar WhatsApp</button>`:''}</div>`;
const fold=(flag,name,label,n,items)=>n?`<button class="t" style="width:100%;margin:10px 0" onclick="${name}=!${name};draw()">${flag?'Ocultar':'Ver'} ${label} (${n})</button>`+(flag?items:''):'';
function draw(){
  if(document.activeElement?.tagName==='INPUT')return;
  const rev=orders.reduce((a,o)=>a+o.total,0);
  const act=orders.filter(o=>o.status!=='entregado').sort((x,y)=>new Date(x.created_at)-new Date(y.created_at));
  const done=orders.filter(o=>o.status==='entregado');
  const today=t0(),up=res.filter(r=>new Date(r.when_at)>=today);
  const past=res.filter(r=>new Date(r.when_at)<today).sort((x,y)=>new Date(y.when_at)-new Date(x.when_at));
  const lbl=dayOff===0?'Hoy':t0(dayOff).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
  let h=`<h1>Barro · Panel</h1>${soundOn?'<p class="muted">🔔 Avisos activados</p>':'<button class="b" onclick="enableSound()">🔔 Activar sonido de avisos</button>'}<div class="card">${lbl}: <b>${fmt(rev)}</b> · ${orders.length} pedidos (${act.length} activos) · ${up.filter(r=>r.status=='pendiente').length} reservas pendientes</div>
  <div class="tabs">${[['orders','Pedidos'],['res','Reservas'],['menu','Menú']].map(([k,l])=>`<button class="t ${tab==k?'on':''}" onclick="tab='${k}';draw()">${l}</button>`).join('')}</div>`;
  if(tab=='orders'){
    h+=`<div class="row2"><button class="t" onclick="goDay(${dayOff-1})">‹ Día anterior</button>${dayOff<0?`<button class="t" onclick="goDay(0)">Hoy</button><button class="t" onclick="goDay(${dayOff+1})">Día siguiente ›</button>`:''}</div>`;
    h+=act.map(orderCard).join('')||'<p>No hay pedidos activos.</p>';
    h+=fold(showDone,'showDone','entregados',done.length,done.map(orderCard).join(''));
  }
  if(tab=='res'){
    h+=up.map(resItem).join('')||'<p>No hay reservas próximas.</p>';
    h+=fold(showPast,'showPast','reservas anteriores',past.length,past.map(resItem).join(''));
  }
  if(tab=='menu')h+=menu.map(m=>`<div class="card">${m.name} <small>${fmt(m.price)}</small> <button class="b" onclick="tog(${m.id},${!m.available})">${m.available?'Disponible ✔':'Agotado ✖'}</button></div>`).join('');
  h+=`<p><button class="t" onclick="db.auth.signOut().then(()=>location.reload())">Cerrar sesión</button></p>`;
  $('#app').innerHTML=h;
}
let ac=null,seenO=null,seenR=null,wl=null,soundOn=false;
async function enableSound(){
  ac=new (window.AudioContext||window.webkitAudioContext)();soundOn=true;beep();
  try{wl=await navigator.wakeLock.request('screen')}catch(e){}
  draw();
}
function beep(){
  if(!ac)return;
  [0,.3,.6].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+t;
    o.frequency.value=880;o.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(.4,n);g.gain.exponentialRampToValueAtTime(.001,n+.25);o.start(n);o.stop(n+.25)});
  if(navigator.vibrate)navigator.vibrate([200,100,200]);
}
function notify(){
  const o=new Set(orders.map(x=>x.id)),r=new Set(res.map(x=>x.id));
  if(seenO){
    const no=[...o].filter(i=>!seenO.has(i)).length,nr=[...r].filter(i=>!seenR.has(i)).length;
    if(no||nr){if(soundOn)beep();document.title='🔔 '+(no?no+' pedido(s) nuevo(s) ':'')+(nr?nr+' reserva(s) nueva(s)':'')}
  }
  seenO=o;seenR=r;
}
window.addEventListener('focus',()=>document.title='Barro – Panel');
document.addEventListener('click',()=>{document.title='Barro – Panel'});
document.addEventListener('visibilitychange',()=>{if(soundOn&&document.visibilityState==='visible'&&navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>wl=l).catch(()=>{})});
function waNum(p){let d=(p||'').replace(/\D/g,'').replace(/^00/,'');if(d.startsWith('54'))return d.startsWith('549')?d:'549'+d.slice(2);d=d.replace(/^0/,'');if(/^1115/.test(d)&&d.length==12)d='11'+d.slice(4);if(d.length==8)d='11'+d;return '549'+d}
function wa(id,estado){
  const r=res.find(x=>x.id==id);if(!r)return;
  const f=new Date(r.when_at).toLocaleString('es-AR',{dateStyle:'full',timeStyle:'short'});
  const msg=`Hola ${r.name}! Tu reserva en Barro para ${r.party} persona(s) el ${f} está confirmada. ¡Te esperamos! Urquiza 4884, Caseros.`;
  window.open('https://wa.me/'+waNum(r.phone)+'?text='+encodeURIComponent(msg),'_blank');
  if(estado)setS('reservations',id,estado);
}
async function setS(t,id,s){await db.from(t).update({status:s}).eq('id',id);load()}
async function tog(id,v){await db.from('menu_items').update({available:v}).eq('id',id);load()}
init();
</script></body></html>
